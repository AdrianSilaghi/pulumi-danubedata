name: CI

# Build, test and SDK validation. Releasing stays on GitHub Actions.
#
# `.forgejo/workflows` completely shadows `.github/workflows` on this forge --
# first-match-wins across .gitea -> .forgejo -> .github, not a merge. Adding
# this file means Forgejo stops running .github/workflows/ci.yml AND
# .github/workflows/release.yml. That is deliberate: this repo is push-mirrored
# to github.com, where release.yml still fires on tags and publishes the SDKs
# to npm, PyPI and NuGet. Those tokens live in GitHub, and `secrets.GITHUB_TOKEN`
# here is scoped to this forge -- a "GitHub release" step run on Forgejo would
# silently create a Forgejo release instead.
#
# release.yml also passes artifacts between jobs via actions/upload-artifact and
# download-artifact, which talk to GitHub's artifact service and do not work
# here. Porting it needs restructuring, not a version bump; it is out of scope.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  PROVIDER: danubedata
  GO_VERSION: '1.22'
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.11'

jobs:
  build:
    name: Build & Test
    # ubuntu-latest is the docker-executor runner. These setup-* actions install
    # toolchains; on a host-mode runner they would install Go 1.22 and Node 18
    # onto the box that builds danubedata production images.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build provider
        run: |
          cd provider
          go build -o ../bin/pulumi-resource-${{ env.PROVIDER }} ./cmd/pulumi-resource-${{ env.PROVIDER }}

      - name: Build tfgen
        run: |
          cd provider
          go build -o ../bin/pulumi-tfgen-${{ env.PROVIDER }} ./cmd/pulumi-tfgen-${{ env.PROVIDER }}

      - name: Run tests
        run: |
          cd provider
          go test -v ./...

      - name: Generate schema
        run: |
          ./bin/pulumi-tfgen-${{ env.PROVIDER }} schema --out provider/cmd/pulumi-resource-${{ env.PROVIDER }}

  validate-sdks:
    name: Validate SDKs
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build tfgen
        run: |
          cd provider
          go build -o ../bin/pulumi-tfgen-${{ env.PROVIDER }} ./cmd/pulumi-tfgen-${{ env.PROVIDER }}

      - name: Generate Node.js SDK
        run: ./bin/pulumi-tfgen-${{ env.PROVIDER }} nodejs --out sdk/nodejs

      - name: Validate Node.js SDK
        run: |
          cd sdk/nodejs
          sed -i 's/\${VERSION}/0.0.0/g' package.json
          npm install
          npm run build

      - name: Generate Python SDK
        run: ./bin/pulumi-tfgen-${{ env.PROVIDER }} python --out sdk/python

      - name: Validate Python SDK
        run: |
          cd sdk/python
          pip install -e .

      - name: Generate Go SDK
        run: ./bin/pulumi-tfgen-${{ env.PROVIDER }} go --out sdk/go

      - name: Validate Go SDK
        run: |
          cd sdk/go/danubedata
          go mod init github.com/AdrianSilaghi/pulumi-danubedata/sdk/go/danubedata
          go mod tidy
          go build ./...
